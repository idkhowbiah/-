<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 7 — OSINT Memory Intercept</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06060b;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 42, 109, 0.08) 0%, transparent 65%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* Контейнер бегущих строк на заднем фоне (эффект табло метро) */
        .ticker-background {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            pointer-events: none;
            padding: 15px 0;
            opacity: 0.35;
        }

        .ticker-row {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            border-top: 1px dashed rgba(255, 107, 129, 0.14);
            border-bottom: 1px dashed rgba(255, 107, 129, 0.14);
            padding: 10px 0;
            background: rgba(10, 10, 18, 0.45);
        }

        .ticker-track {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        .scroll-left {
            animation: marqueeLeft 42s linear infinite;
        }
        .scroll-right {
            animation: marqueeRight 46s linear infinite;
        }
        .speed-fast {
            animation-duration: 32s;
        }
        .speed-slow {
            animation-duration: 54s;
        }

        @keyframes marqueeLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes marqueeRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .phrase-item {
            display: inline-block;
            margin: 0 28px;
            font-size: 1.15rem;
            color: #c4c9d4;
            letter-spacing: 1px;
        }
        .phrase-tag {
            color: #ff477e;
            font-size: 0.8rem;
            margin-right: 8px;
            opacity: 0.85;
        }
        .phrase-dot {
            color: #00f0ff;
            margin-left: 28px;
            opacity: 0.5;
        }

        /* Центральная карточка OSINT-терминала */
        .osint-panel {
            position: relative;
            z-index: 5;
            background: rgba(12, 13, 22, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 71, 126, 0.4);
            border-radius: 16px;
            padding: 36px 42px;
            max-width: 600px;
            width: 92%;
            box-shadow: 
                0 25px 65px rgba(0, 0, 0, 0.9),
                0 0 35px rgba(255, 71, 126, 0.15),
                inset 0 0 20px rgba(0, 240, 255, 0.04);
            overflow: hidden;
        }

        /* Бегающий лазерный луч OSINT-сканера внутри карточки */
        .osint-panel::before {
            content: "";
            position: absolute;
            top: -50%;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.12), rgba(255, 71, 126, 0.2), transparent);
            animation: scanline 5s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { top: -20%; }
            100% { top: 110%; }
        }

        /* Декоративные уголки видоискателя */
        .corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: #00f0ff;
            border-style: solid;
            opacity: 0.7;
        }
        .c-tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .c-tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
        .c-bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .c-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        /* Верхняя строка статуса OSINT */
        .osint-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 14px;
            margin-bottom: 22px;
            font-size: 0.78rem;
            letter-spacing: 2px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff477e;
            font-weight: bold;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ff477e;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff477e;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
        }

        /* Метаданные перехвата */
        .osint-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 0.8rem;
            text-align: left;
        }
        .meta-label {
            color: #64748b;
            display: block;
            font-size: 0.7rem;
            margin-bottom: 2px;
        }
        .meta-val {
            color: #00f0ff;
            font-weight: bold;
        }

        /* Статичный блок с главной подсказкой */
        .target-box {
            text-align: center;
            margin-bottom: 28px;
        }
        .target-sub {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .static-clue {
            background: linear-gradient(90deg, rgba(255, 71, 126, 0.12), rgba(0, 240, 255, 0.12));
            border: 1px solid rgba(255, 71, 126, 0.45);
            border-radius: 10px;
            padding: 18px 20px;
            font-size: 1.32rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 14px rgba(255, 71, 126, 0.55);
            box-shadow: inset 0 0 15px rgba(255, 71, 126, 0.1);
            user-select: text;
        }

        /* Преобразованное поле ввода кода и кнопка */
        .decrypt-form {
            display: flex;
            align-items: stretch;
            background: rgba(6, 7, 12, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .decrypt-form:focus-within {
            border-color: #ff477e;
            box-shadow: 0 0 22px rgba(255, 71, 126, 0.3);
        }
        .input-prefix {
            display: flex;
            align-items: center;
            padding: 0 14px 0 18px;
            color: #00f0ff;
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(0, 240, 255, 0.06);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 1px;
        }
        .decrypt-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 16px;
            color: #ffffff;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
            width: 100%;
        }
        .decrypt-input::placeholder {
            color: #475569;
            letter-spacing: 1.5px;
            font-weight: normal;
            font-size: 0.95rem;
        }
        .decrypt-btn {
            background: linear-gradient(135deg, #ff477e 0%, #ff2a6d 100%);
            color: #ffffff;
            border: none;
            padding: 0 28px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .decrypt-btn:hover {
            background: linear-gradient(135deg, #ff5c8d 0%, #ff0055 100%);
            box-shadow: -4px 0 20px rgba(255, 42, 109, 0.5);
        }

        .error {
            color: #ff4757;
            font-size: 0.85rem;
            margin-top: 14px;
            text-align: center;
            min-height: 1.2em;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Бегущие строки с вашими фразами на заднем фоне -->
    <div class="ticker-background" id="tickerBg"></div>

    <!-- Центральный OSINT-модуль -->
    <div class="osint-panel">
        <span class="corner c-tl"></span>
        <span class="corner c-tr"></span>
        <span class="corner c-bl"></span>
        <span class="corner c-br"></span>

        <div class="osint-header">
            <div class="live-badge">
                <span class="pulse-dot"></span>
                <span>OSINT // Chat Log Intercept</span>
            </div>
            <span>STAGE 07 / 07</span>
        </div>

        <div class="osint-meta">
            <div>
                <span class="meta-label">SOURCE ARCHIVE</span>
                <span class="meta-val">PRIVATE_DIALOG_DB</span>
            </div>
            <div>
                <span class="meta-label">ENCRYPTION STATUS</span>
                <span class="meta-val">AWAITING 3-DIGIT PIN</span>
            </div>
            <div>
                <span class="meta-label">PACKETS CAPTURED</span>
                <span class="meta-val">16 MEMORY FRAGMENTS</span>
            </div>
            <div>
                <span class="meta-label">SEARCH VECTOR</span>
                <span class="meta-val">SHARED MEDIA / PHOTOS</span>
            </div>
        </div>

        <div class="target-box">
            <p class="target-sub">TARGET DIRECTIVE LOCATED IN STREAM:</p>
            <div class="static-clue">Find me in the gallery of our memories</div>
        </div>

        <form class="decrypt-form" id="osintForm">
            <div class="input-prefix">KEY //</div>
            <input type="text" class="decrypt-input" id="code" placeholder="Enter access code..." autocomplete="off">
            <button type="submit" class="decrypt-btn">Decrypt</button>
        </form>

        <div id="err" class="error"></div>
    </div>

    <script>
        // Ваши 16 фраз из чата
        const phrases = [
            "Давай ему колени прострелим",
            "Ты охуела, милая",
            "А я тебя сильнее люблю кстати",
            "Умничка моя",
            "Доброе утро, солнышко",
            "Хорошего тебе дня, котёночек",
            "Я буду кастовать",
            "Надо спатки",
            "Милашка моя",
            "Какой ты сука сладкий",
            "Я тут",
            "Окак",
            "На кол его",
            "Ответ пидора",
            "Возьмёшь флешку, пожалуйста?",
            "Коннект"
        ];

        const timestamps = ["08:14", "23:47", "14:02", "01:19", "19:55", "11:30", "03:12", "22:08"];
        const tickerBg = document.getElementById('tickerBg');
        const rowsCount = 7;

        // Создаем 7 бегущих лент, перемешивая порядок, направление и скорость
        for (let r = 0; r < rowsCount; r++) {
            const row = document.createElement('div');
            row.className = 'ticker-row';

            const track = document.createElement('div');
            const dirClass = r % 2 === 0 ? 'scroll-left' : 'scroll-right';
            const speedClass = r % 3 === 0 ? 'speed-fast' : (r % 3 === 1 ? 'speed-slow' : '');
            track.className = `ticker-track ${dirClass} ${speedClass}`;

            // Сдвигаем стартовую фразу для каждой строки, чтобы все ленты выглядели по-разному
            let rowHTML = '';
            for (let repeat = 0; repeat < 2; repeat++) {
                for (let i = 0; i < phrases.length; i++) {
                    const idx = (i + r * 3) % phrases.length;
                    const time = timestamps[(idx + r) % timestamps.length];
                    rowHTML += `
                        <span class="phrase-item">
                            <span class="phrase-tag">[MSG_${time}]</span>${phrases[idx]}
                            <span class="phrase-dot">&#9670;</span>
                        </span>
                    `;
                }
            }

            track.innerHTML = rowHTML;
            row.appendChild(track);
            tickerBg.appendChild(row);
        }

        // Проверка кода 143
        document.getElementById('osintForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const val = document.getElementById('code').value.trim();
            if (val === "143") {
                window.location.href = atob("Li9maW5hbC1yZXdhcmQtMDB4Lmh0bWw=");
            } else {
                document.getElementById('err').textContent = "[ACCESS DENIED] Hash mismatch. Search our media archive.";
            }
        });
    </script>

</body>
</html>
