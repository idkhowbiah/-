<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM BREACHED</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030305;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: screenShake 3.5s infinite;
        }

        /* Полосы старого монитора и мерцание */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.35) 0px,
                rgba(0, 0, 0, 0.35) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 9;
        }

        /* Тряска всего экрана при сбое */
        @keyframes screenShake {
            0%, 88%, 100% { transform: translate(0, 0) skew(0deg); filter: none; }
            89% { transform: translate(-8px, 3px) skew(-2deg); filter: hue-rotate(90deg); }
            90% { transform: translate(8px, -4px) skew(3deg); }
            91% { transform: translate(-4px, -2px) scale(1.01); filter: invert(0.15); }
            92% { transform: translate(5px, 4px) skew(-1deg); }
            93% { transform: translate(0, 0) skew(0deg); filter: none; }
        }

        /* Центральный хакерский терминал */
        .breach-box {
            position: relative;
            z-index: 5;
            background: rgba(5, 12, 8, 0.9);
            border: 1px solid #00ff41;
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.25),
                inset 0 0 20px rgba(0, 255, 65, 0.1);
            padding: 40px 50px;
            max-width: 640px;
            width: 90%;
            text-align: center;
        }

        /* Декоративные уголки рамки */
        .breach-box::before,
        .breach-box::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #ff0055;
            border-style: solid;
        }
        .breach-box::before {
            top: -4px;
            left: -4px;
            border-width: 3px 0 0 3px;
        }
        .breach-box::after {
            bottom: -4px;
            right: -4px;
            border-width: 0 3px 3px 0;
        }

        .status-tag {
            display: inline-block;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid #ff0055;
            color: #ff0055;
            font-size: 0.78rem;
            letter-spacing: 3px;
            padding: 4px 12px;
            margin-bottom: 22px;
            text-transform: uppercase;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 1; box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
            100% { opacity: 0.4; box-shadow: none; }
        }

        /* Заголовок с жестким RGB-глитчем */
        .glitch-title {
            position: relative;
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 26px;
            text-shadow: 0 0 12px rgba(0, 255, 65, 0.8);
            animation: textJitter 0.25s infinite;
        }

        .glitch-title::before,
        .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch-title::before {
            left: 3px;
            text-shadow: -3px 0 #ff0055;
            animation: slice-1 1.8s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -3px;
            text-shadow: 3px 0 #00f0ff;
            animation: slice-2 1.4s infinite linear alternate-reverse;
        }

        @keyframes textJitter {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes slice-1 {
            0% { clip-path: inset(10% 0 75% 0); transform: translate(-4px, 0); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(4px, 0); }
            40% { clip-path: inset(35% 0 45% 0); transform: translate(-3px, 0); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(3px, 0); }
            80% { clip-path: inset(15% 0 65% 0); transform: translate(-5px, 0); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(2px, 0); }
        }

        @keyframes slice-2 {
            0% { clip-path: inset(70% 0 10% 0); transform: translate(4px, 0); }
            20% { clip-path: inset(15% 0 65% 0); transform: translate(-4px, 0); }
            40% { clip-path: inset(50% 0 25% 0); transform: translate(3px, 0); }
            60% { clip-path: inset(5% 0 80% 0); transform: translate(-3px, 0); }
            80% { clip-path: inset(40% 0 35% 0); transform: translate(5px, 0); }
            100% { clip-path: inset(25% 0 55% 0); transform: translate(-2px, 0); }
        }

        /* Хакерский лог в стиле консоли */
        .terminal-log {
            background: rgba(0, 0, 0, 0.65);
            border-left: 3px solid #00ff41;
            padding: 14px 18px;
            text-align: left;
            font-size: 0.85rem;
            line-height: 1.65;
            color: #9effb6;
            margin-bottom: 30px;
        }
        .terminal-log span.ok {
            color: #00ff41;
            font-weight: bold;
        }
        .terminal-log span.warn {
            color: #00f0ff;
        }

        /* Неоновая кнопка-ссылка с эффектом сбоя */
        .next-link {
            display: inline-block;
            color: #00ff41;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 14px 32px;
            border: 1px solid #00ff41;
            background: rgba(0, 255, 65, 0.08);
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.3);
            transition: all 0.2s ease;
            position: relative;
        }
        .next-link:hover {
            background: #00ff41;
            color: #000000;
            box-shadow: 0 0 30px #00ff41, 0 0 10px #00f0ff;
            transform: scale(1.04);
        }
    </style>
</head>
<body>

    <div class="breach-box">
        <div class="status-tag">&#9888; Security Override Active</div>

        <h1 class="glitch-title" data-text="ACCESS GRANTED">ACCESS GRANTED</h1>

        <div class="terminal-log">
            &gt; PAYLOAD: <span class="warn">SQL_AUTH_BYPASS</span> ... <span class="ok">[OK]</span><br>
            &gt; FIREWALL: <span class="warn">DISABLED</span> ... <span class="ok">[OK]</span><br>
            &gt; PRIVILEGE ESCALATION: <span class="ok">ROOT ACCESS</span><br>
            &gt; NEXT NODE UNLOCKED:
        </div>

        <a href="./stage7-r1d.html" class="next-link">./stage7-r1d.html</a>
    </div>

</body>
</html>
